name: proxmox-vm-group
runtime:
  name: yaml
  options:
    toolchain: uv
    virtualenv: .venv

description: A VM group deployment using the Pulumi Native Proxmox provider

config:
  # Provider Configuration
  proxmox:endpoint:
    type: string
    description: The Proxmox API endpoint URL
    default: https://proxmox.example.com:8006/api2/json
  
  proxmox:username:
    type: string
    description: Username for Proxmox API (format user@realm, e.g., root@pam)
    default: root@pam
  
  proxmox:password:
    type: string
    description: Password for Proxmox API
    secret: true
  
  proxmox:node:
    type: string
    description: Default Proxmox node to use
    default: pve
  
  proxmox:insecure:
    type: boolean
    description: Skip TLS verification
    default: true
  
  # Default VM Configuration
  vm:template_id:
    type: string
    description: ID of the template to clone
    default: "9001"
  
  vm:cores:
    type: number
    description: Number of CPU cores
    default: 2
  
  vm:memory:
    type: number
    description: Memory in MB
    default: 4096
  
  vm:disk_size:
    type: string
    description: Disk size (e.g., 15G)
    default: 15G
  
  vm:network_bridge:
    type: string
    description: Network bridge to use
    default: vmbr0
  
  vm:disk_storage:
    type: string
    description: Storage ID for the disk
    default: local-lvm
  
  vm:vlan_tag:
    type: string
    description: VLAN tag for the VM
    default: "140"
  
  # Cloud-init Configuration
  cloud_init:username:
    type: string
    description: Username for cloud-init
    default: initial
  
  cloud_init:ssh_public_key:
    type: string
    description: Path to SSH public key for cloud-init
    default: ~/.ssh/id_rsa.pub
  
  cloud_init:ssh_private_key:
    type: string
    description: Path to SSH private key for cloud-init
    secret: true
    default: ~/.ssh/id_rsa
  
  # VM Group Configuration - Master Nodes
  master:count:
    type: number
    description: Number of master nodes to create
    default: 3
  
  master:vm_start_id:
    type: number
    description: Starting VM ID for master nodes
    default: 800
  
  master:ip_range:
    type: string
    description: IP range for master nodes (format: start-end)
    default: 10.1.20.80-10.1.20.83
  
  master:gateway:
    type: string
    description: Gateway for master nodes
    default: 10.1.20.1
  
  # VM Group Configuration - Worker Nodes
  worker:count:
    type: number
    description: Number of worker nodes to create
    default: 3
  
  worker:vm_start_id:
    type: number
    description: Starting VM ID for worker nodes
    default: 810
  
  worker:ip_range:
    type: string
    description: IP range for worker nodes (format: start-end)
    default: 10.1.20.84-10.1.20.87
  
  worker:gateway:
    type: string
    description: Gateway for worker nodes
    default: 10.1.20.1

resources:
  # Create the provider instance
  provider:
    type: proxmox:index:Provider
    properties:
      endpoint: ${proxmox:endpoint}
      username: ${proxmox:username}
      password: ${proxmox:password}
      node: ${proxmox:node}
      insecure: ${proxmox:insecure}
  
  # Create master nodes group
  master-nodes:
    type: proxmox:vm:VMGroup
    properties:
      prefix: master
      count: ${master:count}
      vm_start_id: ${master:vm_start_id}
      ip_range: ${master:ip_range}
      gateway: ${master:gateway}
      template_id: ${vm:template_id}
      cores: ${vm:cores}
      memory: ${vm:memory}
      disk_size: ${vm:disk_size}
      disk_storage: ${vm:disk_storage}
      network_bridge: ${vm:network_bridge}
      vlan_tag: ${vm:vlan_tag}
      cloud_init_user: ${cloud_init:username}
      cloud_init_ssh_key: ${cloud_init:ssh_public_key}
      start_on_create: true
      wait_for_ssh: true
  
  # Create worker nodes group
  worker-nodes:
    type: proxmox:vm:VMGroup
    properties:
      prefix: worker
      count: ${worker:count}
      vm_start_id: ${worker:vm_start_id}
      ip_range: ${worker:ip_range}
      gateway: ${worker:gateway}
      template_id: ${vm:template_id}
      cores: ${vm:cores}
      memory: ${vm:memory}
      disk_size: ${vm:disk_size}
      disk_storage: ${vm:disk_storage}
      network_bridge: ${vm:network_bridge}
      vlan_tag: ${vm:vlan_tag}
      cloud_init_user: ${cloud_init:username}
      cloud_init_ssh_key: ${cloud_init:ssh_public_key}
      start_on_create: true
      wait_for_ssh: true

outputs:
  master_vm_ids:
    value: ${master-nodes.vm_ids}
  master_ip_addresses:
    value: ${master-nodes.ip_addresses}
  worker_vm_ids:
    value: ${worker-nodes.vm_ids}
  worker_ip_addresses:
    value: ${worker-nodes.ip_addresses} 