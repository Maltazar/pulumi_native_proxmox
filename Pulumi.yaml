name: pulumi-native-proxmox
runtime:
  name: yaml
  options:
    toolchain: uv
    virtualenv: .venv

description: Pulumi Native Proxmox Provider Configuration Template

config:
  # Provider Configuration
  proxmox:endpoint:
    type: string
    description: "The Proxmox API endpoint URL (e.g., https://proxmox.example.com:8006/api2/json)"
    default: "https://proxmox.example.com:8006/api2/json"
  
  proxmox:username:
    type: string
    description: "Username for Proxmox API (format user@realm, e.g., root@pam)"
    default: "root@pam"
  
  proxmox:password:
    type: string
    description: "Password for Proxmox API"
    secret: true
  
  proxmox:token_id:
    type: string
    description: "API token ID for Proxmox API (alternative to username/password)"
  
  proxmox:token_secret:
    type: string
    description: "API token secret for Proxmox API (alternative to username/password)"
    secret: true
  
  proxmox:node:
    type: string
    description: "Default Proxmox node to use for VM creation"
    default: "pve"
  
  proxmox:insecure:
    type: boolean
    description: "Skip TLS verification (not recommended for production)"
    default: false
  
  proxmox:timeout:
    type: number
    description: "API timeout in seconds"
    default: 30
  
  proxmox:debug:
    type: boolean
    description: "Enable debug logging for the Proxmox API client"
    default: false
  
  # VM Configuration
  vm:template_id:
    type: string
    description: "ID of the template to clone (required)"
  
  vm:cores:
    type: number
    description: "Number of CPU cores"
    default: 1
  
  vm:sockets:
    type: number
    description: "Number of CPU sockets"
    default: 1
  
  vm:memory:
    type: number
    description: "Memory in MB"
    default: 512
  
  vm:disk_size:
    type: string
    description: "Disk size (e.g., '10G', '20G')"
  
  vm:disk_storage:
    type: string
    description: "Storage ID for the disk (e.g., 'local-lvm')"
  
  vm:network_bridge:
    type: string
    description: "Network bridge to use"
    default: "vmbr0"
  
  vm:vlan_tag:
    type: string
    description: "VLAN tag for the VM"
  
  vm:ip_config:
    type: object
    description: "IP configuration for the VM. Example: {ip: '192.168.1.100/24', gateway: '192.168.1.1'}"
  
  vm:start_on_create:
    type: boolean
    description: "Start VM after creation"
    default: true
  
  vm:wait_for_ssh:
    type: boolean
    description: "Wait for SSH to be available after VM creation"
    default: false
  
  # Cloud-init Configuration
  cloud_init:username:
    type: string
    description: "Username for cloud-init"
  
  cloud_init:password:
    type: string
    description: "Password for cloud-init user"
    secret: true
  
  cloud_init:ssh_public_key:
    type: string
    description: "Path or content of SSH public key for cloud-init"
  
  cloud_init:ssh_private_key:
    type: string
    description: "Path or content of SSH private key for cloud-init (needed if wait_for_ssh is true)"
    secret: true
  
  cloud_init:ssh_key_passphrase:
    type: string
    description: "Passphrase for SSH private key (if protected)"
    secret: true
  
  # VM Group Configuration
  vmgroup:prefix:
    type: string
    description: "Prefix for VM names in the group"
    default: "vm"
  
  vmgroup:count:
    type: number
    description: "Number of VMs to create in the group"
    default: 1
  
  vmgroup:vm_start_id:
    type: number
    description: "Starting VM ID for the group"
    default: 100
  
  vmgroup:ip_range:
    type: string
    description: "IP range for VMs in the group (format: start-end, e.g., '10.0.0.10-10.0.0.20')"
    default: "dhcp"
  
  vmgroup:gateway:
    type: string
    description: "Gateway for VMs with static IPs in the group"
  
  # Post-provisioning Configuration
  postprovision:commands:
    type: array
    description: "Commands to run after VM is up"
    default: []
  
  postprovision:files:
    type: array
    description: "Files to copy to the VM after creation"
    description: "Format: [{source: '/path/to/local/file', destination: '/path/on/vm', permissions: '0644'}]"
    default: []
  
  # Additional VM Group Configuration - Master Nodes
  master:count:
    type: number
    description: "Number of master nodes to create"
    default: 3
  
  master:vm_start_id:
    type: number
    description: "Starting VM ID for master nodes"
    default: 800
  
  master:ip_range:
    type: string
    description: "IP range for master nodes (format: start-end)"
  
  master:gateway:
    type: string
    description: "Gateway for master nodes"
  
  # Additional VM Group Configuration - Worker Nodes
  worker:count:
    type: number
    description: "Number of worker nodes to create"
    default: 3
  
  worker:vm_start_id:
    type: number
    description: "Starting VM ID for worker nodes"
    default: 810
  
  worker:ip_range:
    type: string
    description: "IP range for worker nodes (format: start-end)"
  
  worker:gateway:
    type: string
    description: "Gateway for worker nodes" 